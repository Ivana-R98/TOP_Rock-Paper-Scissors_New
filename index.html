<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Cat Mouse Showdown</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./main.js" defer></script>
</head>
<body>
    <header>
        <h1>Dog, Cat, Mouse Showdown <small>(Furball Frenzy)</small></h1>
        <p><em>The ultimate battle of paws, claws, and squeaks!</em></p>
    </header>
    <section class="rules">
        <h2><strong>🐾 Rules:</strong></h2>
        <p><br>
            🐶 Dog beats 🐱 Cat,<br>
            🐱 Cat beats 🐭 Mouse,<br>
            🐭 Mouse beats 🐶 Dog —<br>
            <em>May chaos fill the house!</em> 🏠💥</p>
    </section>
    <main>
        <div class="scores">
            <p id="humanScore"></p>
            <p id="computerScore"></p>
        </div>
        <div class="images">
            <img src="https://placehold.co/250x150" alt="Dog" id="dog" data-choice="dog 🐶">
            <img src="https://placehold.co/250x150" alt="Cat" id="cat" data-choice="cat 🐱">
            <img src="https://placehold.co/250x150" alt="Mouse" id="mouse" data-choice="mouse 🐭">
        </div>
        <p id="choices"></p>
        <p id="roundWinner"></p>
        <p id="victor"></p>
    </main>
    <footer class="credits">
        Cursors by: <br>
        <a target="_blank" href="https://icons8.com/icon/102476/dog-paw">Dog Paw</a> icon by <a target="_blank" href="https://icons8.com">Icons8</a><br>
        <a target="_blank" href="https://icons8.com/icon/103475/cat-footprint">Cat Footprint</a> icon by <a target="_blank" href="https://icons8.com">Icons8</a><br>
        <a target="_blank" href="https://icons8.com/icon/dKXF6nEK79Pz/year-of-rat">Year of Rat</a> icon by <a target="_blank" href="https://icons8.com">Icons8</a>
    </footer>
</body>
</html>
